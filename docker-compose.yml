services:
  postgres:
    image: postgres:16-alpine
    container_name: api-tracker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-api_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-api_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - api_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: api-tracker-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  api_tracker_pgdata:
