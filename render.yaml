# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → connect this repo

databases:
  - name: api-tracker-db
    databaseName: api_tracker
    user: api_tracker
    plan: free

services:
  - type: web
    name: api-tracker
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: REQUIRE_API_KEY
        value: "true"
      - key: API_TRACKER_API_KEY
        generateValue: true
      - key: MAIL_ENABLED
        value: "false"
