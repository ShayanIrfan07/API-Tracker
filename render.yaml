# Render Blueprint: https://render.com/docs/blueprint-spec
# Free tier allows ONE Postgres database per account — reuse an existing DB (see README).

services:
  - type: web
    name: api-tracker
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: REQUIRE_API_KEY
        value: "true"
      - key: API_TRACKER_API_KEY
        generateValue: true
      - key: MAIL_ENABLED
        value: "false"
